<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WU-BOT</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="static/style.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url('/static/wu-tang-logo.jpg'); 
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .container {
            text-align: center;
            padding: 50px;
            color: #fff;
        }

        .wu-logo {
            width: 50px;
            height: auto;
            vertical-align: middle;
        }

        h1 {
            font-size: 3em;
            color: #ffffff; /* White text color */
            text-decoration: none; /* Remove underline or blue line */
        }

        .cipher-header {
            position: relative;
        }

        .wu-logo-left {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translate(-50%, -50%);
        }

        .wu-logo-right {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translate(50%, -50%);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="cipher-header">
            <h1 class="text-center mb-4">Welcome to WU-BOT</h1>
        </div>
        
        <p>Ask me anything, and I'll respond with the wisdom of the Wu-Tang Clan!</p>
        
        <!-- Error Alert (Hidden by default) -->
        <div id="error-container" class="alert alert-danger d-none" role="alert"></div>
        
        <!-- Loading Indicator (Hidden by default) -->
        <div id="loading-indicator" class="text-center d-none">
            <img src="/static/wu-logo.png" alt="Loading..." class="wu-spinner">
        </div>
        
        <!-- Chat Container -->
        <div id="chat-container" class="chat-container"></div>
        
        <!-- Interaction Controls -->
        <div class="row mt-3">
            <div class="col-md-4">
                <select class="form-control" id="function-select">
                    <option value="answer">Answer as Chatbot</option>
                    <option value="kbanswer">Answer from Knowledge Base</option>
                    <option value="search">Search Knowledge Base</option>
                </select>
            </div>
            <div class="col-md-8">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="message-input" 
                        class="form-control" 
                        placeholder="Type your message here..." 
                        aria-label="Message input"
                    >
                    <div class="input-group-append">
                        <button id="send-btn" class="btn btn-primary">Send</button>
                        <button id="clear-btn" class="btn btn-secondary">Clear</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <script src="static/main.js"></script>
</body>
</html>
